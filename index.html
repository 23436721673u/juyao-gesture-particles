<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子星球手势控制器</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 用于MediaPipe输入的视频，隐藏 */
        #input-video {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* UI 提示层 */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            user-select: none;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 166, 0, 0.8);
        }

        .instruction {
            margin-top: 10px;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid #ffaa00;
        }

        .status {
            margin-top: 5px;
            font-weight: bold;
            color: #00ffcc;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 20;
            text-align: center;
            width: min(420px, calc(100vw - 64px));
            padding: 20px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.85);
            font-size: 18px;
            line-height: 1.6;
        }

        #camera-message {
            margin: 0 0 16px;
        }

        #startup-details {
            font-size: 13px;
            text-align: left;
            overflow-wrap: anywhere;
            margin: 12px 0;
        }

        #camera-button {
            padding: 10px 20px;
            border: 1px solid #ffaa00;
            border-radius: 8px;
            color: #fff;
            background: #734000;
            font: inherit;
            cursor: pointer;
        }

        #camera-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #camera-open-page {
            display: block;
            margin-top: 12px;
            color: #ffcc66;
            font-size: 14px;
        }

        #camera-open-page[hidden] {
            display: none;
        }
        
        /* 摄像头预览小窗 */
        #webcam-preview {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            z-index: 10;
            border: 2px solid #333;
            border-radius: 8px;
            opacity: 0.7;
            transform: scaleX(-1); /* 镜像翻转 */
        }
    </style>

    <!-- 1. MediaPipe 依赖 (已下载到本地 vendor，无需联网) -->
    <script src="vendor/mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="vendor/mediapipe/hands/hands.js"></script>

    <!-- 2. Three.js Import Map for Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three/build/three.module.js",
                "three/addons/": "./vendor/three/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loading" role="region" aria-label="摄像头设置">
        <p id="camera-message" role="status" aria-live="polite">点击启用摄像头，允许访问后即可使用手势控制。</p>
        <details id="startup-details" hidden><summary>查看错误详情</summary><p id="startup-error"></p></details>
        <button id="camera-button" type="button">启用摄像头</button>
        <a id="camera-open-page" target="_blank" rel="noopener" hidden>在新窗口中打开游戏</a>
    </div>

    <div id="ui-layer">
        <h1>粒子星云核心</h1>
        <div class="instruction">
            👋 <b>旋转手掌</b>: 旋转相机视角<br>
            ✊ <b>握拳并拉远</b>: 相机远离 (加速)<br>
            ✋ <b>五指张开靠近</b>: 相机靠近 (减速)<br>
        </div>
        <div id="gesture-status" class="status">等待手势...</div>
    </div>

    <!-- 隐藏的原始视频输入 -->
    <video id="input-video" autoplay muted playsinline aria-hidden="true"></video>
    <!-- 用于反馈的小画布 -->
    <canvas id="webcam-preview"></canvas>
    <!-- 主3D场景 -->
    <div id="canvas-container"></div>

    <script type="module">
    async function bootGame() {
        const [THREE, { EffectComposer }, { RenderPass }, { UnrealBloomPass }] = await Promise.all([
            import('three'),
            import('three/addons/postprocessing/EffectComposer.js'),
            import('three/addons/postprocessing/RenderPass.js'),
            import('three/addons/postprocessing/UnrealBloomPass.js')
        ]);

        // ==========================================
        // 1. 全局变量与配置
        // ==========================================
        const CONFIG = {
            planetColor: 0xff6600, // 绚烂橙色
            ringColor: 0xffffff,   // 白色
            particleCount: 8000,
            ringParticleCount: 4000,
            minDistance: 120,      // 最近距离
            maxDistance: 800,      // 最远限制(可选)
            defaultDistance: 300,
            rotationSpeedMultiplier: 0.05
        };

        let scene, camera, renderer, composer;
        let planetSystem, ringSystem1, ringSystem2;
        let time = 0;

        // 相机控制状态
        const cameraState = {
            radius: CONFIG.defaultDistance,
            theta: Math.PI / 2, // 垂直角度
            phi: 0,             // 水平角度
            zoomVelocity: 0,    // 缩放速度
            targetRadius: CONFIG.defaultDistance,
            isFist: false,
            isOpen: false,
            handRotation: 0     // 手掌旋转量
        };

        const statusEl = document.getElementById('gesture-status');
        const loadingEl = document.getElementById('loading');
        const cameraMessageEl = document.getElementById('camera-message');
        const cameraButton = document.getElementById('camera-button');
        const openPageLink = document.getElementById('camera-open-page');
        openPageLink.href = window.location.href;
        openPageLink.hidden = window.self === window.top;

        // ==========================================
        // 2. Three.js 初始化与场景构建
        // ==========================================
        
        function initThree() {
            const container = document.getElementById('canvas-container');

            // 场景
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0005);

            // 相机
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(0, 0, CONFIG.defaultDistance);

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 后期处理 (Bloom 发光)
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0;
            bloomPass.strength = 2.0; // 强度高，显得很亮
            bloomPass.radius = 0.5;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // 创建材质纹理 (光点)
            const particleTexture = createParticleTexture();

            // --- 创建星球 ---
            const planetGeo = new THREE.BufferGeometry();
            const planetPos = [];
            const planetSizes = [];

            // 生成球体表面的密集粒子
            for (let i = 0; i < CONFIG.particleCount; i++) {
                // 极坐标随机分布，但在半径上聚集
                const u = Math.random();
                const v = Math.random();
                const theta = 2 * Math.PI * u;
                const phi = Math.acos(2 * v - 1);
                
                // 半径分布：主要在表面(R=50)，少量在内部填充
                let r = 50; 
                if (Math.random() > 0.8) r = 50 * Math.random(); // 20% 内部填充

                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi);

                planetPos.push(x, y, z);
                planetSizes.push(Math.random() * 2 + 1); // 大小随机
            }

            planetGeo.setAttribute('position', new THREE.Float32BufferAttribute(planetPos, 3));
            planetGeo.setAttribute('size', new THREE.Float32BufferAttribute(planetSizes, 1));

            const planetMat = new THREE.PointsMaterial({
                color: CONFIG.planetColor,
                size: 3,
                map: particleTexture,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            planetSystem = new THREE.Points(planetGeo, planetMat);
            scene.add(planetSystem);

            // --- 创建星环 ---
            const createRing = (radiusInner, radiusOuter, count, tiltX, tiltZ) => {
                const geo = new THREE.BufferGeometry();
                const pos = [];
                for(let i=0; i<count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    // 环的半径分布
                    const r = THREE.MathUtils.lerp(radiusInner, radiusOuter, Math.random());
                    const x = r * Math.cos(angle);
                    const y = (Math.random() - 0.5) * 2; // 环的厚度极薄
                    const z = r * Math.sin(angle);
                    pos.push(x, y, z);
                }
                geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                const mat = new THREE.PointsMaterial({
                    color: CONFIG.ringColor,
                    size: 2,
                    map: particleTexture,
                    transparent: true,
                    opacity: 0.6,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                const sys = new THREE.Points(geo, mat);
                sys.rotation.x = tiltX;
                sys.rotation.z = tiltZ;
                return sys;
            };

            ringSystem1 = createRing(70, 110, CONFIG.ringParticleCount, Math.PI / 3, Math.PI / 6);
            ringSystem2 = createRing(80, 140, CONFIG.ringParticleCount, -Math.PI / 4, -Math.PI / 8);
            
            scene.add(ringSystem1);
            scene.add(ringSystem2);

            // 监听窗口调整
            window.addEventListener('resize', onWindowResize);
        }

        // 辅助函数：生成圆形渐变Canvas纹理
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 32, 32);
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // 3. 动画与逻辑更新
        // ==========================================

        function updateCamera() {
            // 1. 处理旋转 (根据手势)
            // 手掌旋转值 (cameraState.handRotation) 是一个偏移量
            // 如果手旋转了，我们让相机围绕中心旋转（改变 phi）
            // 设置一个死区，防止抖动
            if (Math.abs(cameraState.handRotation) > 0.1) {
                cameraState.phi += cameraState.handRotation * CONFIG.rotationSpeedMultiplier;
            }

            // 2. 处理缩放 (握拳 vs 张开)
            if (cameraState.isFist) {
                // 握拳: 远离。速度先慢后快。
                // 增加向外的速度
                cameraState.zoomVelocity += 0.5; 
            } else if (cameraState.isOpen) {
                // 张开: 靠近。速度先快后慢。
                // 我们通过设置目标点来实现"先快后慢"的 lerp 效果
                // 为了模拟"靠近"，我们将目标设为 minDistance
                cameraState.targetRadius = CONFIG.minDistance;
                
                // 使用 Lerp 逼近，越近越慢
                const diff = cameraState.radius - CONFIG.minDistance;
                cameraState.zoomVelocity = -diff * 0.05; // 距离越远速度越快，越近越慢
            } else {
                // 无手势，阻尼停止
                cameraState.zoomVelocity *= 0.9;
            }

            // 应用速度
            cameraState.radius += cameraState.zoomVelocity;

            // 限制范围
            if (cameraState.radius < CONFIG.minDistance) {
                cameraState.radius = CONFIG.minDistance;
                cameraState.zoomVelocity = 0;
            }
            if (cameraState.radius > 2000) {
                 cameraState.radius = 2000; // 防止无限远
            }

            // 3. 将球坐标转换为笛卡尔坐标
            // x = r * sin(theta) * sin(phi)
            // y = r * cos(theta)
            // z = r * sin(theta) * cos(phi)
            // 注意：为了让星球像在旋转，我们改变 phi (水平环绕)
            
            // 添加一点自然的星球自转感(如果没动手)
            if (!cameraState.isFist && !cameraState.isOpen && Math.abs(cameraState.handRotation) < 0.1) {
               cameraState.phi -= 0.001;
            }

            camera.position.x = cameraState.radius * Math.sin(cameraState.theta) * Math.sin(cameraState.phi);
            camera.position.y = cameraState.radius * Math.cos(cameraState.theta); // 这里 theta 固定为 90度附近，保持水平视角
            camera.position.z = cameraState.radius * Math.sin(cameraState.theta) * Math.cos(cameraState.phi);

            camera.lookAt(0, 0, 0);
        }

        function animate() {
            requestAnimationFrame(animate);

            time += 0.005;

            // 粒子本身的一些细微蠕动
            if (planetSystem) {
                planetSystem.rotation.y = time * 0.1;
            }
            if (ringSystem1) ringSystem1.rotation.z -= 0.002;
            if (ringSystem2) ringSystem2.rotation.z += 0.003;

            updateCamera();

            composer.render();
        }

        // ==========================================
        // 4. MediaPipe Hands 集成
        // ==========================================
        
        // 预览 Canvas
        const previewCanvas = document.getElementById('webcam-preview');
        const previewCtx = previewCanvas.getContext('2d');
        
        function onResults(results) {
            // 绘制预览图（方便用户调试位置）
            previewCtx.save();
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            previewCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 绘制骨架到小窗
                drawConnectors(previewCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(previewCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 2});

                // --- 逻辑判断 ---
                
                // 1. 判断旋转 (计算手掌倾斜度)
                // 使用手腕(0)和中指指根(9)的X坐标差值来判断旋转
                // 正常竖直时，x接近。向左歪或向右歪会产生 deltaX
                const wrist = landmarks[0];
                const middleBase = landmarks[9];
                
                // 计算 Roll 角 (围绕 Z 轴的旋转)
                // Math.atan2(y, x). 这里我们看 dx 和 dy
                // 注意：Webcam 坐标系 y 向下为正
                const dx = middleBase.x - wrist.x;
                const dy = middleBase.y - wrist.y; 
                // 理想竖直状态 dy 很大(负值)，dx 很小
                // 简单起见，我们直接映射 dx。
                // 如果手向右歪(顺时针)，dx > 0。向左歪，dx < 0。
                // 乘以一个灵敏度系数
                cameraState.handRotation = dx * -5.0; // 反向使得符合直觉


                // 2. 判断 握拳 vs 张开
                // 算法：计算指尖(Tip)到手腕(Wrist)的距离，对比指根(MCP)到手腕的距离
                // 如果 Tip 距离 < MCP 距离，说明折叠了。
                
                const fingerTips = [8, 12, 16, 20]; // 食指到小指尖
                const fingerMCPs = [5, 9, 13, 17];  // 食指到小指根
                
                let foldedCount = 0;
                
                // 简单距离平方比较
                const distSq = (p1, p2) => (p1.x - p2.x)**2 + (p1.y - p2.y)**2;

                for (let i = 0; i < 4; i++) {
                    const dTip = distSq(landmarks[fingerTips[i]], wrist);
                    const dMcp = distSq(landmarks[fingerMCPs[i]], wrist);
                    // 如果指尖比指根离手腕更近，或者非常接近，判定为弯曲
                    // 加上一个阈值系数
                    if (dTip < dMcp * 1.2) {
                        foldedCount++;
                    }
                }

                // 状态机
                if (foldedCount >= 3) {
                    cameraState.isFist = true;
                    cameraState.isOpen = false;
                    statusEl.innerText = "状态: ✊ 握拳 (拉远)";
                    statusEl.style.color = "#ff4444";
                } else if (foldedCount === 0) {
                    cameraState.isFist = false;
                    cameraState.isOpen = true;
                    statusEl.innerText = "状态: ✋ 张开 (靠近)";
                    statusEl.style.color = "#44ff44";
                } else {
                    cameraState.isFist = false;
                    cameraState.isOpen = false;
                    statusEl.innerText = "状态: 🤞 旋转控制中";
                    statusEl.style.color = "#00ffcc";
                }

            } else {
                // 没有检测到手
                cameraState.handRotation = 0;
                cameraState.isFist = false;
                cameraState.isOpen = false;
                statusEl.innerText = "未检测到手";
                statusEl.style.color = "#888";
            }
            previewCtx.restore();
        }

        const videoElement = document.getElementById('input-video');
        const HANDS_BASE_URL = './vendor/mediapipe/hands/';
        let mediaStream = null;
        let hands = null;
        let frameRequest = null;
        let cameraStarting = false;
        let cameraSession = 0;

        previewCanvas.width = 160;
        previewCanvas.height = 120;

        function showCameraMessage(message, buttonText = '重试摄像头') {
            cameraMessageEl.textContent = message;
            cameraButton.textContent = buttonText;
            loadingEl.style.display = 'block';
        }

        function stopCamera() {
            cameraSession++;
            cancelAnimationFrame(frameRequest);
            frameRequest = null;
            const stream = mediaStream;
            mediaStream = null;
            if (stream) stream.getTracks().forEach(track => track.stop());
            videoElement.pause();
            videoElement.srcObject = null;
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            cameraState.handRotation = 0;
            cameraState.isFist = false;
            cameraState.isOpen = false;
            cameraState.zoomVelocity = 0;
        }

        function cameraErrorMessage(error) {
            switch (error.name) {
                case 'NotAllowedError':
                case 'PermissionDeniedError':
                    return '摄像头权限未获允许。请在浏览器地址栏的网站权限中允许摄像头，并检查系统的摄像头隐私设置，然后重试。若在内嵌页面中，请在新窗口中打开游戏。';
                case 'NotFoundError':
                case 'DevicesNotFoundError':
                    return '未找到摄像头。请连接或启用摄像头后重试。';
                case 'NotReadableError':
                case 'TrackStartError':
                case 'AbortError':
                    return '摄像头无法读取，可能被其他程序占用。请关闭正在使用摄像头的应用，检查设备连接后重试。';
                case 'OverconstrainedError':
                    return '摄像头不支持当前的视频设置，请更换摄像头后重试。';
                case 'SecurityError':
                    return '浏览器安全设置阻止了摄像头访问。请通过 HTTPS 或 localhost 打开游戏，并允许摄像头权限。';
                case 'NotSupportedError':
                    return '当前浏览器无法启动这台摄像头。请使用 Microsoft Edge 打开同一个 localhost 游戏地址，并允许摄像头权限后重试。';
                default:
                    return '摄像头启动失败，请检查设备和浏览器权限后重试。';
            }
        }

        async function processCameraFrame(session, detector) {
            if (session !== cameraSession || !mediaStream) return;
            try {
                if (!document.hidden && videoElement.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
                    // 等上一帧完成再发送，避免重复推理和未处理的 Promise 错误。
                    await detector.send({image: videoElement});
                }
            } catch (error) {
                if (session !== cameraSession) return;
                console.error('手势识别失败:', error);
                stopCamera();
                hands = null;
                Promise.resolve().then(() => detector.close()).catch(console.warn);
                statusEl.textContent = '手势识别已停止';
                showCameraMessage('手势识别加载或运行失败。请检查网络连接后重试。');
                return;
            }
            if (session === cameraSession && mediaStream) {
                frameRequest = requestAnimationFrame(() => processCameraFrame(session, detector));
            }
        }

        async function startCamera() {
            if (cameraStarting || mediaStream) return;
            if (!window.isSecureContext) {
                showCameraMessage('当前地址不支持摄像头访问。请通过 HTTPS 或 http://localhost 打开游戏；手机访问电脑时请使用 HTTPS。');
                return;
            }
            if (!navigator.mediaDevices?.getUserMedia) {
                showCameraMessage('当前浏览器无法使用摄像头，请在最新版 Chrome、Edge 或 Safari 中打开游戏。');
                return;
            }
            const policy = document.permissionsPolicy || document.featurePolicy;
            if (policy?.allowsFeature && !policy.allowsFeature('camera')) {
                // 注意：file:// 等 null origin 下 allowsFeature 可能误报为 false，
                // 这里仅做提示，不直接阻断；真正被拦截时 getUserMedia 会给出准确错误。
                console.warn('摄像头权限策略可能受限，仍尝试请求权限。');
            }

            cameraStarting = true;
            cameraButton.disabled = true;
            const session = ++cameraSession;
            let stage = 'camera';
            showCameraMessage('正在请求摄像头权限，请在浏览器提示中选择允许…', '正在启动…');
            try {
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        audio: false,
                        video: {
                            facingMode: {ideal: 'user'},
                            width: {ideal: 640},
                            height: {ideal: 480}
                        }
                    });
                } catch (error) {
                    if (error.name !== 'OverconstrainedError' || session !== cameraSession) throw error;
                    stream = await navigator.mediaDevices.getUserMedia({video: true, audio: false});
                }
                // 页面关闭或离开后才授权的流也需要释放。
                if (session !== cameraSession) {
                    stream.getTracks().forEach(track => track.stop());
                    return;
                }
                mediaStream = stream;
                stream.getVideoTracks().forEach(track => track.addEventListener('ended', () => {
                    if (session !== cameraSession) return;
                    stopCamera();
                    statusEl.textContent = '摄像头已断开';
                    showCameraMessage('摄像头连接已中断或权限已被撤回，请检查设备和权限后重试。');
                }));

                videoElement.srcObject = stream;
                videoElement.muted = true;
                await videoElement.play();
                if (session !== cameraSession) return;

                stage = 'model';
                showCameraMessage('摄像头已连接，正在加载手势识别…', '正在加载…');
                if (!hands) {
                    if (typeof window.Hands !== 'function' || typeof window.drawConnectors !== 'function' ||
                        typeof window.drawLandmarks !== 'function' || !window.HAND_CONNECTIONS) {
                        throw new Error('手势识别脚本未加载，请检查网络后刷新页面。');
                    }
                    hands = new window.Hands({locateFile: file => `${HANDS_BASE_URL}${file}`});
                    hands.setOptions({
                        maxNumHands: 1,
                        modelComplexity: 1,
                        minDetectionConfidence: 0.5,
                        minTrackingConfidence: 0.5
                    });
                }
                const detector = hands;
                detector.onResults(results => {
                    if (session === cameraSession && mediaStream) onResults(results);
                });
                // 第一帧推理成功后再隐藏提示，模型下载失败也能显示错误并重试。
                await detector.send({image: videoElement});
                if (session !== cameraSession) return;
                loadingEl.style.display = 'none';
                frameRequest = requestAnimationFrame(() => processCameraFrame(session, detector));
            } catch (error) {
                if (session !== cameraSession) return;
                console.error('摄像头/手势识别启动失败:', error);
                stopCamera();
                if (stage === 'model' && hands) {
                    const failedDetector = hands;
                    hands = null;
                    Promise.resolve().then(() => failedDetector.close()).catch(console.warn);
                }
                statusEl.textContent = '手势控制未启用';
                showCameraMessage(stage === 'model'
                    ? '摄像头已连接，但手势识别资源加载失败。请检查网络连接后重试；若仍失败，请刷新页面。'
                    : cameraErrorMessage(error));
            } finally {
                cameraStarting = false;
                cameraButton.disabled = false;
            }
        }

        window.addEventListener('pagehide', () => {
            stopCamera();
            showCameraMessage('点击重新启用摄像头，继续手势控制。', '启用摄像头');
        });

        // ==========================================
        // 启动
        // ==========================================
        initThree();
        animate();
        cameraButton.addEventListener('click', startCamera);
    }

    if (window.location.protocol === 'file:') {
        // 本地文件无法加载 ES 模块和手势模型，先提供可操作的启动入口。
        document.getElementById('camera-message').textContent =
            '请先双击同目录的“启动游戏.cmd”，它会启动本地服务并打开游戏。直接打开 index.html 无法加载游戏资源。若本地服务已启动，也可点击下方按钮。';
        const button = document.getElementById('camera-button');
        button.textContent = '打开本地游戏';
        button.addEventListener('click', () => window.location.assign('http://localhost:8000/'));
        document.getElementById('gesture-status').textContent = '请通过本地服务启动游戏';
    } else {
        bootGame().catch(error => {
            console.error('游戏初始化失败:', error);
            document.getElementById('camera-message').textContent =
                '游戏资源或 3D 场景未能启动。请关闭此页面，双击游戏目录中的“启动游戏.cmd”，在自动打开的浏览器页面中重试。若仍失败，请展开错误详情。';
            document.getElementById('startup-details').hidden = false;
            document.getElementById('startup-error').textContent =
                `${error.name || 'Error'}: ${error.message || String(error)}\n页面地址：${window.location.href}`;
            const button = document.getElementById('camera-button');
            button.textContent = '重新加载游戏';
            button.addEventListener('click', () => window.location.reload());
        });
    }

    </script>
</body>
</html>
